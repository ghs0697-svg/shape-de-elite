<style>

  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }

  b { color: var(--text); }

  /* vídeo em pé: o YouTube só carrega quando a pessoa toca */

  /* passos */

  .linha { position: relative; padding-left: 26px; }

  .marco::before { content: ''; position: absolute; left: -24px; top: 5px; width: 12px; height: 12px; border-radius: 50%; background: var(--red); border: 2px solid var(--bg); box-shadow: 0 0 0 2px var(--red); }
  .marco .q { font-size: 12px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }

  /* dúvidas de quem acabou de entrar */

  .duvidas summary::-webkit-details-marker { display: none; }

  /* casos: logo no começo e pequenos; tocar na foto abre ela grande */
  #casos { margin-top: 22px; text-align: center; }
  .casos-titulo { font-size: 16px; line-height: 1.25; margin: 0 0 10px; }
  .casos { display: flex; justify-content: center; gap: 8px; margin: 0 0 8px; }
  .casos button { flex: 0 1 88px; padding: 0; border: 0; background: none; border-radius: 10px; cursor: zoom-in; }
  .casos img { display: block; width: 100%; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }
  #casos .miudo { margin: 0 auto; max-width: 34em; font-size: 12px; }
  .zoom { position: fixed; inset: 0; z-index: 40; width: 100%; border: 0; background: rgba(0,0,0,.92); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
  .zoom img { max-width: 100%; max-height: 100%; border-radius: 12px; }

  /* próximo nível */
  .nivel { border-color: #4a3c14; background: linear-gradient(180deg, #1d1a12, var(--surface)); }
  .nivel .kicker { color: var(--gold); }
  .nivel p { color: var(--text-dim); font-size: 15px; margin: 0 0 10px; }
  .oferta-video { margin: 12px auto 14px; max-width: 280px; }
  .oferta-video video { display: block; width: 100%; aspect-ratio: 9 / 16; border-radius: 14px; border: 1px solid var(--border); background: #000; }
  .nivel .oferta-linha { text-align: center; font-size: 13px; color: var(--text-muted); margin: 8px 0 0; }
  .pilha { margin: 4px 0 14px; }
  .nivel .pilha-titulo { color: var(--text); font-weight: 800; margin: 0 0 8px; }
  .pilha ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .pilha li { background: rgba(255,255,255,.03); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .pilha li b { display: block; font-size: 15px; }

  .nivel .vagas { text-align: center; font-size: 13px; color: var(--text-muted); margin: 12px 0 0; }
  .preco { text-align: center; margin: 14px 0; }
  .preco .selo { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: #1d1a12; background: var(--gold); border-radius: 999px; padding: 4px 10px; }
  .preco .de { color: var(--text-muted); font-size: 14px; margin-top: 8px; }
  .preco .parcela { font-size: clamp(30px, 10vw, 40px); font-weight: 900; line-height: 1.1; color: var(--text); }
  .preco .avista { color: var(--text-dim); font-size: 14px; }

  footer { margin-top: 36px; text-align: center; color: var(--text-muted); font-size: 12.5px; padding-bottom: 8px; }
  footer p { margin: 6px 0; }
  .fixo { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: rgba(15,15,17,.94); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-top: 1px solid var(--border); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .fixo .btn { max-width: 528px; margin: 0 auto; }
  [hidden] { display: none !important; }

/* ===== Padrão comum dos três "Comece por aqui" (consultoria, Shape, Peitão), cada um nas SUAS cores. GH em 14/10/2026:
   "quero que todas tenham o mesmo padrao de playbook, tipo meio que marca propria" e "algo parecido com o liquid glass que
   adicionamos no quiz"; e em 15/10, corrigindo: "cada produto tem suas proprias cores". O padrão é a forma: fundo escuro com
   brilho e quadriculado numa camada presa à tela, Inter, selo, última palavra do título na cor do produto, cartões de vidro
   e o botão principal em degradê com brilho por dentro. Os tokens do vidro são os do quiz, copiados como estão
   (02-produtos/metodogh/quiz/index.html, bloco "Vidro líquido", da LandingPage). A cor é a do Shape (vermelho; dourado só
   de apoio, como no app). O bloco final da consultoria segue dourado: é a cor do Método GH. Fica no fim de propósito. ===== */
:root {
  --marca: #B41E1E; --marca-clara: #F05252; --marca-escura: #7E1414; --marca-suave: rgba(180,30,30,.12);
  --vidro: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, rgba(255,255,255,0.06) 45%, rgba(255,255,255,0.03) 100%);
  --vidro-forte: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.10) 50%, rgba(255,255,255,0.05) 100%);
  --vidro-borda: rgba(255,255,255,0.20);
  --vidro-brilho: inset 0 1px 0 rgba(255,255,255,0.34), inset 0 -1px 0 rgba(255,255,255,0.05);
  --vidro-sombra: 0 10px 30px rgba(0,0,0,0.30);
  --vidro-fosco: blur(18px) saturate(170%);
  --red: var(--marca); --red-hover: var(--marca-escura); --red-text: var(--marca-clara); --gold: #F5C542;
  --bg: #0F0F11; --surface: rgba(28,28,30,.78); --surface-2: rgba(255,255,255,.05); --border: #2E2E32;
  --text: #F4F4F4; --text-dim: #A8A8AE; --text-muted: #8A8A90;
}
html { background: var(--bg); }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); -webkit-font-smoothing: antialiased; }
.fundo { position: fixed; inset: 0; z-index: 0; pointer-events: none; background: radial-gradient(ellipse 80% 50% at 50% 0%, rgba(180,30,30,.34) 0%, rgba(74,14,14,.44) 30%, transparent 70%), radial-gradient(ellipse 100% 60% at 100% 90%, rgba(180,30,30,.14), transparent 55%), linear-gradient(180deg, #1A0808 0%, var(--bg) 60%); }
.fundo::after { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px); background-size: 32px 32px; mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%); -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 30%, transparent 75%); }
body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(circle 230px at 10% 26%, rgba(240,82,82,0.26), transparent 70%), radial-gradient(circle 270px at 94% 50%, rgba(180,30,30,0.26), transparent 70%), radial-gradient(circle 220px at 26% 86%, rgba(126,20,20,0.32), transparent 70%); }
.wrap, footer { position: relative; z-index: 1; }
.marca { font-size: 15px; font-weight: 900; letter-spacing: .06em; color: var(--text); }
.marca b { color: var(--marca-clara); }
.check { width: 64px; height: 64px; margin: 22px auto 0; border-radius: 50%; display: grid; place-items: center; background: linear-gradient(135deg, #E84848, var(--marca-escura)); box-shadow: 0 0 0 8px var(--marca-suave), 0 12px 32px rgba(180,30,30,.40); color: #FFFFFF; font-size: 32px; font-weight: 900; animation: pop 600ms cubic-bezier(.16,1,.3,1) both; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .check { animation: none; } }
h1 { font-weight: 900; line-height: 1.12; font-size: clamp(28px, 7.4vw, 38px); margin: 16px 0 10px; }
h1 .hl { color: var(--marca-clara); }
.sub { text-wrap: balance; }
h2 { font-weight: 900; letter-spacing: -.01em; }
.kicker { color: var(--marca-clara); letter-spacing: .08em; font-size: 11.5px; }
.card, .item, .pilha li { background: var(--vidro); border: 1px solid var(--vidro-borda); border-radius: 18px; box-shadow: var(--vidro-brilho), var(--vidro-sombra); -webkit-backdrop-filter: var(--vidro-fosco); backdrop-filter: var(--vidro-fosco); }
.pilha li { border-radius: 14px; box-shadow: var(--vidro-brilho); }
.depois { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.10); }
.dica { border-color: rgba(255,255,255,.18); }
.passo .n { background: var(--marca-suave); border: 1px solid rgba(240,82,82,.45); color: #FF7A7A; }
.marco::before { background: var(--marca-clara); box-shadow: 0 0 0 2px var(--marca); }
.linha::before { background: rgba(255,255,255,.14); }
.btn { background: linear-gradient(135deg, rgba(232,72,72,0.95) 0%, rgba(180,30,30,0.90) 50%, rgba(126,20,20,0.92) 100%); border: 1px solid rgba(255,190,190,0.50); border-radius: 18px; color: #FFFFFF; box-shadow: inset 0 1px 0 rgba(255,255,255,0.45), inset 0 -10px 18px rgba(60,0,0,0.25), 0 12px 36px rgba(180,30,30,0.38); }
.btn:active { transform: scale(.98); background: linear-gradient(135deg, rgba(210,60,60,0.96), rgba(150,24,24,0.94)); }
.btn.sec { background: var(--marca-suave); border: 1px solid rgba(240,82,82,.50); color: #FF7A7A; box-shadow: var(--vidro-brilho); }
.btn.whats { background: var(--green); border: 1px solid rgba(255,255,255,.18); color: #06260F; box-shadow: inset 0 1px 0 rgba(255,255,255,.35), 0 10px 28px rgba(37,211,102,.28); }
.video { max-width: none; margin: 20px 0 0; }
.video .quadro { aspect-ratio: 16 / 9; border-radius: 18px; border: 1px solid var(--vidro-borda); box-shadow: var(--vidro-brilho), 0 12px 32px rgba(0,0,0,.45); background: radial-gradient(ellipse at center, rgba(180,30,30,.20), rgba(0,0,0,0) 62%), #0b0b0d; background-size: cover; background-position: center; }
.video .play { background: linear-gradient(135deg, #E84848, var(--marca-escura)); box-shadow: 0 0 0 8px var(--marca-suave), 0 12px 32px rgba(180,30,30,.40); }
.video .play::before { border-color: transparent transparent transparent #FFFFFF; }
.video .rot { text-shadow: 0 1px 6px rgba(0,0,0,.8); }
.video video { position: absolute; inset: 0; width: 100%; height: 100%; background: #000; display: block; }
.casos img { border: 1px solid var(--vidro-borda); border-radius: 12px; }
/* o bloco final é a consultoria do Método GH: fica na cor dela (dourado), como já era */
.nivel { background: linear-gradient(135deg, rgba(201,162,75,.16), rgba(20,20,20,.7)); border: 1px solid rgba(201,162,75,.45); }
.nivel .kicker { color: #E6C76A; }
.btn.ouro { background: linear-gradient(135deg, rgba(248,226,154,0.94) 0%, rgba(216,178,90,0.86) 50%, rgba(172,136,52,0.88) 100%); border: 1px solid rgba(255,244,205,0.68); color: #1A1405; box-shadow: inset 0 1px 0 rgba(255,255,255,0.68), inset 0 -10px 18px rgba(120,88,18,0.22), 0 12px 36px rgba(201,162,75,0.38); }
.oferta-video video { border: 1px solid var(--vidro-borda); border-radius: 18px; }
.preco .selo { background: linear-gradient(135deg, #E6C76A, #9C7C2E); color: #1A1405; }
.duvidas details { border-top-color: rgba(255,255,255,.12); }
.fixo { background: rgba(15,15,17,.62); border-top: 1px solid var(--vidro-borda); -webkit-backdrop-filter: var(--vidro-fosco); backdrop-filter: var(--vidro-fosco); }
/* troca de língua (um Comece por aqui só: padrão português, com inglês e espanhol; GH 27/10) */
.linguas { margin: 10px 0 0; font-size: 13px; color: var(--text-muted); }
.linguas a { color: var(--text-muted); text-decoration: none; padding: 4px 2px; }
.linguas a.on { color: var(--text); font-weight: 700; }
</style>

  var tela = document.getElementById('tela'), dedo = document.getElementById('dedo'), leg = document.getElementById('leg');
  var cartao = document.getElementById('cartao'), capa = document.getElementById('capa'), pausa = document.getElementById('pausa'), barra = document.getElementById('barra');
  document.getElementById('cartao-w').textContent = t.abre;
  var imgs = {};
  CENAS.forEach(function (c) { if (c.img && !imgs[c.img]) { var i = new Image(); i.alt = ''; i.decoding = 'async'; imgs[c.img] = i; tela.insertBefore(i, dedo); } });
  var audio = new Audio(); audio.preload = 'auto';
  var TOTAL = CENAS.reduce(function (s, c) { return s + (c.dur || 3) + 0.4; }, 0);
  var idx = -1, feito = 0, tocando = false, contado = false, timer = null;

  function mostra(i) {
    var c = CENAS[i];
    leg.classList.remove('on');
    setTimeout(function () { leg.innerHTML = c.leg; leg.classList.add('on'); }, 180);
    if (!c.img) { tela.hidden = true; cartao.classList.add('on'); dedo.classList.remove('on'); document.getElementById('cartao-w').textContent = i === 0 ? t.abre : ''; return; }
    cartao.classList.remove('on'); tela.hidden = false;
    Object.keys(imgs).forEach(function (k) { imgs[k].classList.toggle('on', k === c.img); });
    var img = imgs[c.img], a = c.alvo || [50, 50];
    // aproxima um pouco do ponto que o dedo toca, pra ler melhor no celular
    img.style.transformOrigin = a[0] + '% ' + a[1] + '%'; img.style.transform = 'scale(1)';
    requestAnimationFrame(function () { img.style.transform = 'scale(1.05)'; });
    dedo.classList.remove('toca'); dedo.style.left = a[0] + '%'; dedo.style.top = a[1] + '%'; dedo.classList.add('on');
    setTimeout(function () { dedo.classList.add('toca'); }, Math.min(1800, (c.dur || 3) * 400));
  }
  function proxima() {
    if (idx >= 0) feito += (CENAS[idx].dur || 3) + 0.4;
    idx++;
    if (idx >= CENAS.length) { termina(); return; }
    mostra(idx);
    var c = CENAS[idx];
    audio.src = c.audio;
    var p = audio.play(); if (p && p.catch) p.catch(function () { timer = setTimeout(proxima, (c.dur || 3) * 1000); });
  }
  audio.addEventListener('ended', function () { if (tocando) timer = setTimeout(proxima, 400); });
  audio.addEventListener('timeupdate', function () { barra.style.width = Math.min(100, (feito + audio.currentTime) / TOTAL * 100) + '%'; });
  function termina() {
    tocando = false; idx = -1; feito = 0; barra.style.width = '100%';
    pausa.hidden = true; capa.hidden = false; capa.querySelector('.rot').textContent = t.assistir;
  }
  capa.addEventListener('click', function () {
    capa.hidden = true; pausa.hidden = false; pausa.textContent = '❚❚'; pausa.setAttribute('aria-label', t.pausa);
    if (!contado) { contado = true; conta('play-intl'); }
    tocando = true;
    if (idx < 0) { barra.style.width = '0'; proxima(); }
    else { var p = audio.play(); if (p && p.catch) p.catch(function () {}); }
  });
  pausa.addEventListener('click', function () {
    if (!tocando) return;
    tocando = false; clearTimeout(timer); audio.pause();
    pausa.hidden = true; capa.hidden = false; capa.querySelector('.rot').textContent = t.toca;
  });
  // capa: a tela do resultado (calorias, dieta e treino) atrás do play, pra mostrar que é o app
  var capaCena = CENAS.filter(function (c) { return c.id === 'resultado'; })[0];
  if (capaCena) { tela.hidden = false; imgs[capaCena.img].classList.add('on'); }
  // fotos carregam só quando a página já abriu (não pesam na abertura)
  window.addEventListener('load', function () { Object.keys(imgs).forEach(function (k) { imgs[k].src = k; }); });
})();
</script>
</body>
</html>
